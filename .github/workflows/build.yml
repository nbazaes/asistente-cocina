name: Build and Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SLUG=$(jq -r '.expo.slug' app.json)
          jq --arg v "$VERSION" '.expo.version = $v' app.json > app.tmp.json
          mv app.tmp.json app.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build APK with EAS
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          json=$(pnpm dlx eas-cli build --platform android --profile production --non-interactive --json --wait)
          build_url=$(echo "$json" | jq -r '.[0].artifacts.buildUrl // .artifacts.buildUrl')
          echo "build_url=$build_url" >> "$GITHUB_OUTPUT"
          echo "Build URL: $build_url"

      - name: Download APK
        id: download
        run: |
          filename="${{ steps.version.outputs.slug }}-${{ steps.version.outputs.version }}.apk"
          curl -sSfL -o "$filename" "${{ steps.build.outputs.build_url }}"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ steps.download.outputs.filename }}
