name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

  build:
    name: Build APK and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SLUG=$(grep -oP 'slug:\s*"\K[^"]+' app.config.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build APK with EAS
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          json=$(pnpm dlx eas-cli build --platform android --profile production --non-interactive --json --wait)
          build_url=$(echo "$json" | jq -r '.[0].artifacts.buildUrl // .artifacts.buildUrl')
          echo "build_url=$build_url" >> "$GITHUB_OUTPUT"
          echo "Build URL: $build_url"

      - name: Download APK
        id: download
        run: |
          filename="${{ steps.version.outputs.slug }}-${{ steps.version.outputs.version }}.apk"
          curl -sSfL -o "$filename" "${{ steps.build.outputs.build_url }}"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.slug }} v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: ${{ steps.download.outputs.filename }}